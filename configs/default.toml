# Paths are relative to the repo root. Run commands from there.
[paths]
raw_dir = "data/raw"
parsed_dir = "data/parsed"
chunks_dir = "data/chunks"
questions_dir = "data/questions"
cache_db = "data/cache/cache.sqlite"   # embeddings + LLM responses; delete to clear
results_dir = "results"

[chunking]
# Name of a function in src/ingest/chunk.py's CHUNKERS table.
method = "pack_sections"
# Measured with the embedding model's own tokenizer (below).
max_tokens = 500

[embedding]
model = "BAAI/bge-small-en-v1.5"   # reads up to 512 tokens
dim = 384                          # must match vector(384) in db/schema.sql
batch_size = 32

[retrieval]
k = 5                 # chunks given to the answer model
method = "vector"     # "vector" or "hybrid" (vector + keyword, rank fusion)
# collection = "..."  # default: the corpus name
# rerank_model = "BAAI/bge-reranker-base"   # optional cross-encoder rerank
# rerank_candidates = 20                    # how many chunks it re-scores

[database]
# The DATABASE_URL environment variable overrides this.
url = "postgresql://rag:rag@localhost:5433/rag"

# Dollars per million tokens (Anthropic list prices, Oct 2026). Used only to report run cost.
[pricing.claude-haiku-5-5]
input = 0.10
output = 0.50

[pricing.claude-sonnet-5-5]
input = 2.00
output = 10.00

[pricing.claude-opus-5-5]
input = 4.00
output = 20.00
